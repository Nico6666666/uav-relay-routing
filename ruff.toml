# 全仓库 Ruff 配置（四类任务共用一套）。
#
# 两个刻意的设置：
#   * selected 中显式启用 E402：各子任务主程序为了先做 `sys.path.insert` 再导入
#     `公共库` / `运输调度` / `通信中继`，必须在文件中部写 import，那些 `# noqa: E402` 才有意义。
#     若不启用 E402，编辑器会把它们报成"未使用的 noqa 指令"。
#   * known-first-party 中登记 `公共库` / `运输调度` / `通信中继`：让 isort 把它们排在
#     第三方包（numpy / scipy / matplotlib）之后，而不是混在一起。
#
# 未启用的规则（B / SIM / UP / C4 等）不属于本项目采用的风格口径，故不纳入。

line-length = 120
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F", "I", "RUF100"]

[lint.isort]
known-first-party = ["源代码", "公共库", "运输调度", "通信中继"]
